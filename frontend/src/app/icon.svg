<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ExamGuard Acid Chrome">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#0A0A0E"/>
    </linearGradient>
    <radialGradient id="acidHalo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#CCFF00" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#FF00FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquidChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#B8BEC6"/>
      <stop offset="50%" stop-color="#55585E"/>
      <stop offset="75%" stop-color="#D4D8DC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="iridescentRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FF00FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="voltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#CCFF00" flood-opacity="0.6"/>
      <feDropShadow dx="2" dy="2" stdDeviation="8" flood-color="#FF00FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#acidHalo)"/>

  <!-- Liquid Chrome Shield with Iridescent Rim -->
  <path d="M256 66 C322 92 384 104 418 108 C430 176 432 254 418 322 C404 398 342 440 256 478 C170 440 108 398 94 322 C80 254 82 176 94 108 C128 104 190 92 256 66 Z"
        fill="#08080C" stroke="url(#iridescentRim)" stroke-width="24" stroke-linejoin="round" filter="url(#voltGlow)"/>

  <!-- Inner Acid Star & Techno Geometry -->
  <path d="M144 226 L256 154 L368 226 L368 258 L256 186 L144 258 Z" fill="url(#liquidChrome)"/>
  <path d="M178 240 H236 V272 H324 L306 312 H236 V336 H348 L324 386 H178 Z" fill="url(#liquidChrome)"/>

  <!-- Spark Star in Volt -->
  <polygon points="376,270 382,295 407,301 382,307 376,332 370,307 345,301 370,295" fill="#CCFF00"/>
</svg>
